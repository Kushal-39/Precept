name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan catches CVEs disclosed between commits.
    - cron: "0 0 * * 0"

permissions: read-all

jobs:
  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - run: gosec -quiet ./...

  govulncheck:
    name: Dependency Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - run: govulncheck ./...
