name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan catches CVEs disclosed between commits.
    - cron: "0 0 * * 0"

permissions: read-all

jobs:
  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: securecodewarrior/gosec-action@v1

  govulncheck:
    name: Dependency Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...
