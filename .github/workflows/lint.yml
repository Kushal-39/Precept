name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
