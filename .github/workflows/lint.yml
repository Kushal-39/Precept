name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m
