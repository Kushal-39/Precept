apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: default
spec:
  selector:
    app: precept
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          image: precept:1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: batch
spec:
  containers:
    - name: worker
      image: worker:2.1.0
